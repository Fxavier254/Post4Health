    // --- LOCALSTORAGE SERVICE ---
    const KEYS = {
      VERSION: 'post4health_seed_v7_admin_scheduling',
      SHIPMENTS: 'post4health_shipments',
      TEMP_LOGS: 'post4health_temp_logs',
      ISSUES: 'post4health_issues',

    const storageService = {
      init() {
        if (localStorage.getItem(KEYS.VERSION) !== 'post4health_seed_v7_admin_scheduling') {
          this.resetToSeed();
        }
      },
      resetToSeed() {
        localStorage.setItem(KEYS.VERSION, 'post4health_seed_v7_admin_scheduling');
        localStorage.setItem(KEYS.SHIPMENTS, JSON.stringify(INITIAL_SHIPMENTS));
        localStorage.setItem(KEYS.TEMP_LOGS, JSON.stringify(INITIAL_TEMP_LOGS));
        localStorage.setItem(KEYS.ISSUES, JSON.stringify(INITIAL_ISSUES));
        localStorage.setItem(KEYS.FACILITIES, JSON.stringify(INITIAL_FACILITIES));
        localStorage.setItem(KEYS.DRIVERS, JSON.stringify(INITIAL_DRIVERS));
        localStorage.setItem(KEYS.NOTIFICATIONS, JSON.stringify(INITIAL_NOTIFICATIONS));
      },
      getShipments() {
        try {
          const data = localStorage.getItem(KEYS.SHIPMENTS);
          return data ? JSON.parse(data) : INITIAL_SHIPMENTS;
        } catch(e) { return INITIAL_SHIPMENTS; }
      },
      saveShipments(s) { localStorage.setItem(KEYS.SHIPMENTS, JSON.stringify(s)); },
      updateShipmentStatus(id, newStatus, extraData = {}) {
        const list = this.getShipments();
        let targetShipment = null;
        const updated = list.map(item => {
          if (item.id === id) {
            targetShipment = { ...item, status: newStatus, ...extraData };
            return targetShipment;
          }
          return item;
        });

        this.saveShipments(updated);

        if (targetShipment) {
          if (newStatus === 'in_transit') {
            this.addNotification({
              id: `NOT-${Date.now()}`,
              timestamp: new Date().toISOString(),
              message: `Dispatch started for ${targetShipment.facility} (${targetShipment.medicine}). Driver ${targetShipment.driverName || targetShipment.driver} is en route. Receiver ${targetShipment.receiverName || 'Pharmacy Officer'} (${targetShipment.receiverPhone || ''}) notified.`,
              type: 'trip_started',
              hospital: targetShipment.facility
            });
          } else if (newStatus === 'delivered') {
            this.addNotification({
              id: `NOT-${Date.now()}`,
              timestamp: new Date().toISOString(),
              message: `${targetShipment.facility} confirmed receipt & signed for ${targetShipment.medicine}. Driver ${targetShipment.driverName || targetShipment.driver} notified.`,
              type: 'delivery_confirmed',
              hospital: targetShipment.facility
            });
          }
        }

        return updated;
      },
      updateShipmentTemp(id, newTemp) {
        const list = this.getShipments().map(item => item.id === id ? { ...item, currentTemp: newTemp } : item);
        this.saveShipments(list);
        return list;
      },
      decrementEtaMinutes() {
        const list = this.getShipments();
        let changed = false;
        const updated = list.map(item => {
          if (item.status === 'in_transit' && item.etaMinutes > 0) {
            changed = true;
            const newEta = item.etaMinutes - 1;
            return {
              ...item,
              etaMinutes: newEta,
              eta: newEta === 0 ? 'ARRIVING NOW' : `~${newEta} min`
            };
          }
          return item;
        });
        if (changed) this.saveShipments(updated);
        return updated;
      },
      getNotifications() {
        try {
          const data = localStorage.getItem(KEYS.NOTIFICATIONS);
          return data ? JSON.parse(data) : INITIAL_NOTIFICATIONS;
        } catch(e) { return INITIAL_NOTIFICATIONS; }
      },
      addNotification(notif) {
        const list = this.getNotifications();
        const updated = [notif, ...list];
        localStorage.setItem(KEYS.NOTIFICATIONS, JSON.stringify(updated));
        return updated;
      },
      addShipment(newShipment) {
        const list = [newShipment, ...this.getShipments()];
        this.saveShipments(list);
        this.addTempLog({ shipmentId: newShipment.id, timestamp: new Date().toISOString(), temperature: newShipment.currentTemp || 4.5 });

          id: `NOT-${Date.now()}`,
          timestamp: new Date().toISOString(),
          message: `New consignment ${newShipment.id} scheduled for ${newShipment.facility}. Assigned to driver ${newShipment.driverName || newShipment.driver} & receiver ${newShipment.receiverName || 'Pharmacy Officer'}.`,
          type: 'shipment_created',
          hospital: newShipment.facility
        });
        return list;
      },
      getTempLogs(shipmentId = null) {

          return shipmentId ? logs.filter(l => l.shipmentId === shipmentId) : logs;
        } catch(e) { return INITIAL_TEMP_LOGS; }
      },
      addTempLog(logEntry) {
        const logs = [...this.getTempLogs(), logEntry];
        localStorage.setItem(KEYS.TEMP_LOGS, JSON.stringify(logs));
        return logs;
      },
      getIssues(shipmentId = null) {
        try {
          const data = localStorage.getItem(KEYS.ISSUES);
          const issues = data ? JSON.parse(data) : INITIAL_ISSUES;
          return shipmentId ? issues.filter(i => i.shipmentId === shipmentId) : issues;
        } catch(e) { return INITIAL_ISSUES; }
      },
      addIssue(issueEntry) {
        const issues = [issueEntry, ...this.getIssues()];
        localStorage.setItem(KEYS.ISSUES, JSON.stringify(issues));
        this.updateShipmentStatus(issueEntry.shipmentId, 'issue', { notes: issueEntry.notes });
        return issues;
      },
      getFacilities() {
        try {
          const data = localStorage.getItem(KEYS.FACILITIES);
          return data ? JSON.parse(data) : INITIAL_FACILITIES;
        } catch(e) { return INITIAL_FACILITIES; }
      },

          return data ? JSON.parse(data) : INITIAL_DRIVERS;
        } catch(e) { return INITIAL_DRIVERS; }
      }
    };

    // --- NOTIFICATION DISPATCH MODAL (WHATSAPP DEEP LINK) ---
    function NotificationModal({ shipment, isOpen, onClose }) {
      if (!isOpen || !shipment) return null;
      const receiverName = shipment.receiverName || "Receiver Officer";
      const rawPhone = shipment.receiverPhone || "0702896052";
      const facility = shipment.facility || "Hospital";
      const medicine = shipment.medicine || "Vaccine Payload";
      const driverName = shipment.driverName || shipment.driver || "Driver";

      const formatPhone = (phoneStr) => {
        const clean = phoneStr.replace(/[^0-9]/g, '');
        if (clean.startsWith('0')) return '254' + clean.slice(1);

    // --- CSV EXPORT UTILITY ---
    function exportCSV(shipments) {
      const allLogs = storageService.getTempLogs();
      const allIssues = storageService.getIssues();

      const headers = ["Shipment ID", "Facility Name", "Medicine Type", "Driver Name", "Driver Phone", "Receiver Name", "Receiver Phone", "Scheduled Date", "Scheduled Time", "Status", "Required Min Temp (°C)", "Required Max Temp (°C)", "Recorded Min Temp (°C)", "Recorded Max Temp (°C)", "Total Readings", "Total Breaches", "Compliance Rate (%)", "Confirmation Code", "Recipient Name", "Reported Issues", "Created Date", "Delivered Date"];

      const rows = shipments.map(s => {
        const logs = allLogs.filter(l => l.shipmentId === s.id);
        const shipmentIssues = allIssues.filter(i => i.shipmentId === s.id);

        let minTemp = "N/A", maxTemp = "N/A", breaches = 0, complianceRate = "100.0";
        if (logs.length > 0) {
          const temps = logs.map(l => l.temperature);
          minTemp = Math.min(...temps).toFixed(1);
          maxTemp = Math.max(...temps).toFixed(1);
          const breachCount = logs.filter(l => l.temperature < s.tempMin || l.temperature > s.tempMax).length;
          breaches = breachCount;
          complianceRate = (((logs.length - breachCount) / logs.length) * 100).toFixed(1);
        }

        const issueText = shipmentIssues.map(i => `${i.type}: ${i.notes}`).join(" | ") || "None";
        const formattedCreated = s.createdAt ? new Date(s.createdAt).toLocaleString() : "";
        const formattedDelivered = s.deliveredAt ? new Date(s.deliveredAt).toLocaleString() : "Not Delivered";

        return [
          `"${s.id}"`, `"${s.facility.replace(/"/g, '""')}"`, `"${s.medicine.replace(/"/g, '""')}"`, `"${(s.driverName || s.driver).replace(/"/g, '""')}"`, `"${(s.driverPhone || '').replace(/"/g, '""')}"`, `"${(s.receiverName || '').replace(/"/g, '""')}"`, `"${(s.receiverPhone || '').replace(/"/g, '""')}"`, `"${s.scheduledDate || ''}"`, `"${s.scheduledTime || ''}"`, `"${s.status.toUpperCase()}"`, s.tempMin, s.tempMax, minTemp, maxTemp, logs.length, breaches, `"${complianceRate}%"`, `"${s.confirmationCode}"`, `"${(s.recipientName || 'N/A').replace(/"/g, '""')}"`, `"${issueText.replace(/"/g, '""')}"`, `"${formattedCreated}"`, `"${formattedDelivered}"`
        ].join(",");
      });

      const rawCsvString = [headers.join(","), ...rows].join("\n");
      const timestamp = new Date().toISOString().slice(0, 10);
      const filename = `Post4Health_ColdChain_Compliance_Report_${timestamp}.csv`;

      if (window.AndroidNative && window.AndroidNative.shareCSV) {
        window.AndroidNative.shareCSV(rawCsvString, filename);
        return;
      }

      const csvContent = "data:text/csv;charset=utf-8," + rawCsvString;
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // --- COMPLIANCE REPORT MODAL ---
    function ComplianceReportModal({ shipment, isOpen, onClose }) {
      if (!isOpen || !shipment) return null;
      const logs = storageService.getTempLogs(shipment.id);
      const issues = storageService.getIssues(shipment.id);

      let minTemp = "N/A", maxTemp = "N/A", breaches = 0, complianceRate = "100.0%";
      if (logs.length > 0) {
        const temps = logs.map(l => l.temperature);
        minTemp = Math.min(...temps).toFixed(1) + "°C";
        maxTemp = Math.max(...temps).toFixed(1) + "°C";
        breaches = logs.filter(l => l.temperature < shipment.tempMin || l.temperature > shipment.tempMax).length;
        complianceRate = (((logs.length - breaches) / logs.length) * 100).toFixed(1) + "%";
      }

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-xl max-w-2xl w-full shadow-2xl overflow-hidden border border-slate-200">
            <div className="bg-[#006b3f] px-5 py-4 text-white flex items-center justify-between">
              <div>
                <h3 className="font-extrabold text-base">Cold-Chain Audit Matrix</h3>
                <p className="text-xs text-emerald-100 font-mono font-semibold">Consignment ID: {shipment.id}</p>
              </div>
              <button onClick={onClose} className="text-white/80 hover:text-white font-black text-lg">✕</button>
            </div>
            <div className="p-5 space-y-4 text-xs">
              <div className="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-lg border border-slate-300 text-center">
                <div>
                  <span className="text-[10px] font-extrabold text-slate-600 block uppercase">Recorded Range</span>
                  <span className="font-mono font-black text-slate-900 mt-0.5 block text-sm">{minTemp} / {maxTemp}</span>
                </div>
                <div>
                  <span className="text-[10px] font-extrabold text-slate-600 block uppercase">Compliance Rate</span>
                  <span className="font-mono font-black text-[#006b3f] mt-0.5 block text-sm">{complianceRate}</span>
                </div>
                <div>
                  <span className="text-[10px] font-extrabold text-slate-600 block uppercase">Breach Count</span>
                  <span className={`font-mono font-black mt-0.5 block text-sm ${breaches > 0 ? 'text-rose-600' : 'text-slate-900'}`}>{breaches}</span>
                </div>
              </div>

              <div>
                <h4 className="font-extrabold text-slate-900 mb-1.5 uppercase text-xs">Consignment Details</h4>
                <div className="bg-white p-3.5 rounded-lg border border-slate-300 space-y-1.5 text-slate-800 font-semibold">
                  <p><strong>Medicine:</strong> {shipment.medicine}</p>
                  <p><strong>Facility:</strong> {shipment.facility}</p>
                  <p><strong>Scheduled:</strong> {shipment.scheduledDate || 'Today'} {shipment.scheduledTime || ''}</p>
                  <p><strong>Driver:</strong> {shipment.driverName || shipment.driver} ({shipment.driverPhone || ''})</p>
                  <p><strong>Receiver:</strong> {shipment.receiverName || 'Officer'} ({shipment.receiverPhone || '0702896052'})</p>
                  <p><strong>Handover Pin:</strong> <span className="font-mono font-black text-slate-950 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">{shipment.confirmationCode}</span></p>
                </div>
              </div>

              <div className="flex justify-end space-x-2 pt-2 border-t border-slate-200">
                <button onClick={() => exportCSV([shipment])} className="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 font-extrabold border border-slate-300">Export Audit CSV</button>

    }

    // --- MODALS ---
    function MarkDeliveredModal({ shipment, isOpen, onClose, onConfirm }) {
      const [code, setCode] = useState('');
      const [name, setName] = useState('');
      const [notes, setNotes] = useState('');
      const [err, setErr] = useState('');

      if (!isOpen || !shipment) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!code.trim()) { setErr('Please enter confirmation pin.'); return; }
        if (code.trim() !== shipment.confirmationCode) { setErr(`Invalid pin! Expected: ${shipment.confirmationCode}`); return; }
        if (!name.trim()) { setErr('Please enter recipient name.'); return; }
        onConfirm(shipment.id, { confirmationCode: code.trim(), recipientName: name.trim(), notes: notes.trim(), deliveredAt: new Date().toISOString() });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-xl max-w-md w-full shadow-2xl overflow-hidden border border-slate-200">
            <div className="bg-[#006b3f] px-5 py-4 text-white flex items-center justify-between">
              <h3 className="font-extrabold text-base">Confirm Delivery Receipt</h3>
              <button onClick={onClose} className="text-white/80 hover:text-white font-black text-lg">✕</button>
            </div>
            <form onSubmit={handleSubmit} className="p-5 space-y-4 text-xs">
              {err && <div className="bg-rose-50 text-rose-800 font-bold p-2.5 rounded-lg border border-rose-300">{err}</div>}
              <div>
                <label className="block font-bold text-slate-900 mb-1">Handover Pin *</label>
                <input type="text" value={code} onChange={e => setCode(e.target.value)} placeholder={`Pin (Demo: ${shipment.confirmationCode})`} className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg font-mono font-bold tracking-widest text-slate-900 bg-white" />
              </div>
              <div>
                <label className="block font-bold text-slate-900 mb-1">Recipient Full Name *</label>
                <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Dr. Sarah Maina" className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg font-bold text-slate-900 bg-white" />
              </div>
              <div>
                <label className="block font-bold text-slate-900 mb-1">Handover Remarks</label>
                <textarea value={notes} onChange={e => setNotes(e.target.value)} rows="2" placeholder="Inspection remarks..." className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg font-medium text-slate-900 bg-white" />
              </div>
              <div className="flex justify-end space-x-2 pt-2 border-t border-slate-200">
                <button type="button" onClick={onClose} className="px-4 py-2.5 border border-slate-300 rounded-lg text-slate-800 font-extrabold hover:bg-slate-100">Cancel</button>
                <button type="submit" className="px-4 py-2.5 rounded-lg bg-[#006b3f] text-white font-extrabold">Confirm Delivery</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function ReportIssueModal({ shipment, isOpen, onClose, onSubmitIssue }) {
      const [type, setType] = useState('temperature breach');
      const [notes, setNotes] = useState('');
      const [err, setErr] = useState('');

      if (!isOpen || !shipment) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!notes.trim()) { setErr('Please provide issue notes.'); return; }
        onSubmitIssue({ shipmentId: shipment.id, type, notes: notes.trim(), timestamp: new Date().toISOString(), facility: shipment.facility });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-xl max-w-md w-full shadow-2xl overflow-hidden border border-slate-200">
            <div className="bg-rose-700 px-5 py-4 text-white flex items-center justify-between">
              <h3 className="font-extrabold text-base">Flag Consignment Issue</h3>
              <button onClick={onClose} className="text-white/80 hover:text-white font-black text-lg">✕</button>
            </div>
            <form onSubmit={handleSubmit} className="p-5 space-y-4 text-xs">
              {err && <div className="bg-rose-50 text-rose-800 font-bold p-2.5 rounded-lg border border-rose-300">{err}</div>}
              <div>
                <label className="block font-bold text-slate-900 mb-1">Issue Category *</label>
                <select value={type} onChange={e => setType(e.target.value)} className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg bg-white font-bold text-slate-900">
                  <option value="temperature breach">Temperature Breach</option>
                  <option value="damaged packaging">Damaged Packaging</option>
                  <option value="wrong item">Incorrect Consignment</option>
                  <option value="short quantity">Short Quantity</option>
                </select>
              </div>
              <div>
                <label className="block font-bold text-slate-900 mb-1">Observational Notes *</label>
                <textarea value={notes} onChange={e => setNotes(e.target.value)} rows="3" placeholder="Describe findings..." className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg font-medium text-slate-900 bg-white" />
              </div>
              <div className="flex justify-end space-x-2 pt-2 border-t border-slate-200">
                <button type="button" onClick={onClose} className="px-4 py-2.5 border border-slate-300 rounded-lg text-slate-800 font-extrabold hover:bg-slate-100">Cancel</button>
                <button type="submit" className="px-4 py-2.5 rounded-lg bg-rose-600 text-white font-extrabold">Submit Issue</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function NewShipmentModal({ isOpen, onClose, onCreateShipment, facilities, drivers }) {
      const todayStr = new Date().toISOString().split('T')[0];
      const timeStr = new Date().toTimeString().slice(0, 5);

      const defaultFacility = facilities[0] || { name: 'Aga Khan University Hospital', location: '3rd Parklands Avenue, Nairobi', contactPerson: 'Admin Test', phone: '0702896052' };
      const defaultDriver = drivers[0] || { name: 'Peter Mwangi', phone: '+254 701 112 233', vehicle: 'KCF 482L (Cold Van)' };

      const [fac, setFac] = useState(defaultFacility.name);
      const [addr, setAddr] = useState(defaultFacility.location);
      const [med, setMed] = useState('AstraZeneca COVID-19 Vaccine (2-8°C)');
      const [min, setMin] = useState(2);
      const [max, setMax] = useState(8);

      const [recName, setRecName] = useState(defaultFacility.contactPerson || 'Pharmacy Officer');
      const [recPhone, setRecPhone] = useState(defaultFacility.phone || '0702896052');

      const [drvName, setDrvName] = useState(defaultDriver.name);
      const [drvPhone, setDrvPhone] = useState(defaultDriver.phone);
      const [drvVehicle, setDrvVehicle] = useState(defaultDriver.vehicle);

      const [sDate, setSDate] = useState(todayStr);
      const [sTime, setSTime] = useState(timeStr);

      const [notes, setNotes] = useState('Priority cold chain consignment dispatch.');

      if (!isOpen) return null;

      const handleFacilityChange = (name) => {
        setFac(name);
        const selected = facilities.find(f => f.name === name);
        if (selected) {
          setAddr(selected.location);
          if (selected.contactPerson) setRecName(selected.contactPerson);
          if (selected.phone) setRecPhone(selected.phone);
        }
      };

      const handleDriverChange = (name) => {
        setDrvName(name);
        const selected = drivers.find(d => d.name === name);
        if (selected) {
          setDrvPhone(selected.phone);
          setDrvVehicle(selected.vehicle);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();

        onCreateShipment({
          id: `SHP-${Math.floor(1000 + Math.random() * 9000)}`,
          facility: fac,
          address: addr,
          medicine: med,
          tempMin: Number(min),
          tempMax: Number(max),
          driver: drvName,
          driverName: drvName,
          driverPhone: drvPhone,
          driverVehicle: drvVehicle,
          receiverName: recName,
          receiverPhone: recPhone,
          scheduledDate: sDate,
          scheduledTime: sTime,
          status: 'scheduled',
          createdAt: new Date().toISOString(),
          deliveredAt: null,
          confirmationCode: Math.floor(1000 + Math.random() * 9000).toString(),
          recipientName: null,
          notes,
          currentTemp: (Number(min) + Number(max)) / 2,
          etaMinutes: 25
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-xl max-w-xl w-full shadow-2xl overflow-hidden border border-slate-200 my-8">
            <div className="bg-[#006b3f] px-5 py-4 text-white flex items-center justify-between">
              <h3 className="font-extrabold text-base">Schedule New Medical Delivery</h3>
              <button onClick={onClose} className="text-white/80 hover:text-white font-black text-lg">✕</button>
            </div>
            <form onSubmit={handleSubmit} className="p-5 space-y-4 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold text-slate-900 mb-1">Hospital / Facility *</label>
                  <select value={fac} onChange={e => handleFacilityChange(e.target.value)} className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg bg-white font-bold text-slate-900">
                    {facilities.map(f => <option key={f.id} value={f.name}>{f.name}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block font-bold text-slate-900 mb-1">Delivery Address *</label>
                  <input type="text" value={addr} onChange={e => setAddr(e.target.value)} className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg font-bold text-slate-900 bg-white" required />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-emerald-50/50 p-3 rounded-lg border border-emerald-200">
                <div>
                  <label className="block font-bold text-slate-900 mb-1">Receiver Name *</label>
                  <input type="text" value={recName} onChange={e => setRecName(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg font-bold text-slate-900 bg-white" required />
                </div>
                <div>
                  <label className="block font-bold text-slate-900 mb-1">Receiver Phone *</label>
                  <input type="tel" value={recPhone} onChange={e => setRecPhone(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg font-mono font-bold text-slate-900 bg-white" required />
                </div>
              </div>

              <div>
                <label className="block font-bold text-slate-900 mb-1">Medicine Payload *</label>
                <input type="text" value={med} onChange={e => setMed(e.target.value)} className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg font-bold text-slate-900 bg-white" required />
              </div>

              <div className="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200">
                <div>
                  <label className="block font-bold text-slate-900 mb-1">Min Temp (°C)</label>
                  <input type="number" step="0.5" value={min} onChange={e => setMin(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg font-bold text-slate-900 bg-white" required />
                </div>
                <div>
                  <label className="block font-bold text-slate-900 mb-1">Max Temp (°C)</label>
                  <input type="number" step="0.5" value={max} onChange={e => setMax(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg font-bold text-slate-900 bg-white" required />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold text-slate-900 mb-1">Assigned Driver</label>
                  <select value={drvName} onChange={e => handleDriverChange(e.target.value)} className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg bg-white font-bold text-slate-900">
                    {drivers.map(d => <option key={d.id} value={d.name}>{d.name} ({d.vehicle})</option>)}
                  </select>
                </div>
                <div>
                  <label className="block font-bold text-slate-900 mb-1">Driver Phone *</label>
                  <input type="tel" value={drvPhone} onChange={e => setDrvPhone(e.target.value)} className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg font-mono font-bold text-slate-900 bg-white" required />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3 bg-blue-50/60 p-3 rounded-lg border border-blue-200">
                <div>
                  <label className="block font-bold text-slate-900 mb-1">Scheduled Date *</label>
                  <input type="date" value={sDate} onChange={e => setSDate(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg font-bold text-slate-900 bg-white" required />
                </div>
                <div>
                  <label className="block font-bold text-slate-900 mb-1">Scheduled Time *</label>
                  <input type="time" value={sTime} onChange={e => setSTime(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg font-bold text-slate-900 bg-white" required />
                </div>
              </div>

              <div>
                <label className="block font-bold text-slate-900 mb-1">Dispatch Instructions</label>
                <textarea value={notes} onChange={e => setNotes(e.target.value)} rows="2" className="w-full px-3 py-2 border border-slate-300 rounded-lg font-semibold text-slate-900 bg-white" />
              </div>

              <div className="flex justify-end space-x-2 pt-2 border-t border-slate-200">
                <button type="button" onClick={onClose} className="px-4 py-2.5 border border-slate-300 rounded-lg text-slate-800 font-extrabold hover:bg-slate-100">Cancel</button>
                <button type="submit" className="px-5 py-2.5 rounded-lg bg-[#006b3f] text-white font-extrabold">+ Schedule Delivery</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [isLoading, setIsLoading] = useState(true);

      useEffect(() => {
        storageService.init();
        const timer = setTimeout(() => {
          setIsLoading(false);
        }, 1500);
        return () => clearTimeout(timer);
      }, []);

      const [activeRole, setActiveRole] = useState('ADMIN');
      const [shipments, setShipments] = useState(() => storageService.getShipments());
      const [facilities] = useState(() => storageService.getFacilities());
      const [drivers] = useState(() => storageService.getDrivers());

      const [selectedShipment, setSelectedShipment] = useState(null);
      const [notificationShipment, setNotificationShipment] = useState(null);
      const [isMarkDeliveredOpen, setIsMarkDeliveredOpen] = useState(false);
      const [isReportIssueOpen, setIsReportIssueOpen] = useState(false);
      const [isNewShipmentOpen, setIsNewShipmentOpen] = useState(false);
      const [isComplianceModalOpen, setIsComplianceModalOpen] = useState(false);
      const [isNotificationModalOpen, setIsNotificationModalOpen] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        if (window.AndroidNative && window.AndroidNative.showToast) {
          window.AndroidNative.showToast(msg);
        }
        setTimeout(() => setToast(null), 4000);
      };

      const handleResetSeed = () => {
        storageService.resetToSeed();
        setShipments(storageService.getShipments());
        showToast("Reset to initial sample data");
      };

      // Live Telemetry Simulation (every 5 seconds)
      useEffect(() => {
        if (isLoading) return;

        const interval = setInterval(() => {
          const currentList = storageService.getShipments();
          const inTransitList = currentList.filter(s => s.status === 'in_transit');

          if (inTransitList.length > 0) {
            inTransitList.forEach(shipment => {
              const isAnomaly = Math.random() < 0.12;
              let newTemp;
              if (isAnomaly) {
                const goHigh = Math.random() > 0.5;
                newTemp = goHigh
                  ? shipment.tempMax + Number((Math.random() * 2.0 + 0.4).toFixed(1))
                  : shipment.tempMin - Number((Math.random() * 1.5 + 0.4).toFixed(1));
              } else {
                const mid = (shipment.tempMin + shipment.tempMax) / 2;
                const delta = (Math.random() - 0.5) * 1.6;
                newTemp = Number((mid + delta).toFixed(1));
                if (newTemp < shipment.tempMin) newTemp = shipment.tempMin + 0.2;
                if (newTemp > shipment.tempMax) newTemp = shipment.tempMax - 0.2;
              }

              if ((newTemp < shipment.tempMin || newTemp > shipment.tempMax) && window.AndroidNative && window.AndroidNative.triggerVibration) {
                window.AndroidNative.triggerVibration();
              }

              storageService.updateShipmentTemp(shipment.id, newTemp);
              storageService.addTempLog({ shipmentId: shipment.id, timestamp: new Date().toISOString(), temperature: newTemp });
            });

            setShipments(storageService.getShipments());
          }
        }, 5000);

        return () => clearInterval(interval);
      }, [isLoading]);

      // Live ETA Minutes Countdown Ticker (decrements every 10 seconds)
      useEffect(() => {
        if (isLoading) return;

        const etaInterval = setInterval(() => {
          const updatedList = storageService.decrementEtaMinutes();
          setShipments(updatedList);
        }, 10000);

        return () => clearInterval(etaInterval);
      }, [isLoading]);

      const handleStartTrip = (id) => {
        const target = shipments.find(s => s.id === id);
        const updated = storageService.updateShipmentStatus(id, 'in_transit', { currentTemp: 4.2, etaMinutes: 15 });
        setShipments(updated);
        setNotificationShipment(target);
        setIsNotificationModalOpen(true);
        const receiver = target?.receiverName || 'Receiver';
        const facility = target?.facility || 'Hospital';
        showToast(`Notification sent to ${receiver} at ${facility} via SMS/WhatsApp.`);
      };

      const handleConfirmDelivery = (id, data) => {
        const updated = storageService.updateShipmentStatus(id, 'delivered', { deliveredAt: data.deliveredAt, recipientName: data.recipientName, notes: data.notes, etaMinutes: 0 });
        setShipments(updated);
        showToast(`Receipt Confirmed & Signed. Driver & Admin notified.`);
      };

      const handleReportIssue = (issueData) => {
        storageService.addIssue(issueData);
        setShipments(storageService.getShipments());
        showToast(`Issue flagged for ${issueData.shipmentId}. Admin notified.`);
      };

      const handleCreateShipment = (newShipment) => {
        const updated = storageService.addShipment(newShipment);
        setShipments(updated);
        showToast(`Scheduled delivery ${newShipment.id} created! Driver & receiver assigned.`);
      };

      if (isLoading) {
        return <SplashScreen />;
      }

      const unreadCount = storageService.getNotifications().length;

      return (
        <div className="min-h-screen flex flex-col bg-[#F8FAFC]">
          <Navbar activeRole={activeRole} setActiveRole={setActiveRole} onResetSeed={handleResetSeed} notificationCount={unreadCount} />

          <main className="flex-1 pb-10">
            {activeRole === 'DRIVER' && (
              <DriverView
                shipments={shipments}
                onStartTrip={handleStartTrip}
                onOpenMarkDeliveredModal={(s) => { setSelectedShipment(s); setIsMarkDeliveredOpen(true); }}
              />
            )}
            {activeRole === 'FACILITY' && (
              <FacilityView
                facilities={facilities}
                shipments={shipments}
                onOpenConfirmReceiptModal={(s) => { setSelectedShipment(s); setIsMarkDeliveredOpen(true); }}
                onOpenReportIssueModal={(s) => { setSelectedShipment(s); setIsReportIssueOpen(true); }}
              />
            )}
            {activeRole === 'ADMIN' && (
              <AdminDashboard
                shipments={shipments}
                onOpenNewShipmentModal={() => setIsNewShipmentOpen(true)}
                onOpenComplianceModal={(s) => { setSelectedShipment(s); setIsComplianceModalOpen(true); }}
              />
            )}
          </main>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-4 right-4 z-50 bg-[#006b3f] text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold transition-all">
              ✓ {toast}
            </div>
          )}

          {/* Modals */}
          <MarkDeliveredModal
            shipment={selectedShipment}
            isOpen={isMarkDeliveredOpen}
            onClose={() => setIsMarkDeliveredOpen(false)}
            onConfirm={handleConfirmDelivery}
          />
          <ReportIssueModal
            shipment={selectedShipment}
            isOpen={isReportIssueOpen}
            onClose={() => setIsReportIssueOpen(false)}
            onSubmitIssue={handleReportIssue}
          />
          <NewShipmentModal
            isOpen={isNewShipmentOpen}
            onClose={() => setIsNewShipmentOpen(false)}
            onCreateShipment={handleCreateShipment}
            facilities={facilities}
            drivers={drivers}
          />
          <ComplianceReportModal
            shipment={selectedShipment}
            isOpen={isComplianceModalOpen}
            onClose={() => setIsComplianceModalOpen(false)}
          />
          <NotificationModal
            shipment={notificationShipment}
            isOpen={isNotificationModalOpen}
            onClose={() => setIsNotificationModalOpen(false)}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
